name: Build and deploy Kamen-app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kamen-app-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build app
        run: npm run build
      - name: Verify built entry point
        run: |
          test -f dist/index.html
          grep -q '/Kamen-app/assets/' dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "ERROR: GitHub Pages build is publishing uncompiled source."
            exit 1
          fi
          echo "Built index.html references compiled Vite assets."
          cat dist/index.html
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
